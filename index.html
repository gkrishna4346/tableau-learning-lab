<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tableau Learning Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-width workbook. A frozen band on top holds the title, the Product and Mode containers
   and the theme toggle; its second line names the chosen product. Light = grey with navy text, dark = navy with white text; titles in dark orange.
   Pills keep Tableau's meaning: blue = discrete, green = continuous / done. */
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --sunk:#E2E6EC; --ink:#0D1F45; --muted:#46557A; --line:#CDD3DE;
  --band:#DDE2EA; --band-ink:#0D1F45; --band-soft:#3A4A70; --band-line:#C3CAD7;
  --title:#C2530A;
  --dim:#2459B8; --dim-bg:#DFE8F8; --mea:#22794A; --mea-bg:#DCEFE3; --accent:#C2530A; --accent-bg:#FBE7D7; --warn:#A93A2A; --warn-bg:#F7E0DB;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:8px;
  --gut-l:max(16px, 3vw, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, 3vw, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1730; --surface:#10213F; --sunk:#172B4F; --ink:#FFFFFF; --muted:#B9C5DC; --line:#24395F;
  --band:#071226; --band-ink:#FFFFFF; --band-soft:#C3CDE2; --band-line:#22365A;
  --title:#FF8A1F;
  --dim:#7FB0FF; --dim-bg:#1A3260; --mea:#6FD39A; --mea-bg:#163D33; --accent:#FF8A1F; --accent-bg:#3A2410; --warn:#FF9A85; --warn-bg:#40201C; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0A1730; --surface:#10213F; --sunk:#172B4F; --ink:#FFFFFF; --muted:#B9C5DC; --line:#24395F;
  --band:#071226; --band-ink:#FFFFFF; --band-soft:#C3CDE2; --band-line:#22365A;
  --title:#FF8A1F;
  --dim:#7FB0FF; --dim-bg:#1A3260; --mea:#6FD39A; --mea-bg:#163D33; --accent:#FF8A1F; --accent-bg:#3A2410; --warn:#FF9A85; --warn-bg:#40201C; color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px, 3vw, env(safe-area-inset-left, 0px));padding-right:max(16px, 3vw, env(safe-area-inset-right, 0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--band)}
.wrap{width:100%;margin:0;padding-block:0 32px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* frozen masthead */
.masthead{position:sticky;top:env(safe-area-inset-top, 0px);z-index:6;background:var(--band);color:var(--band-ink);
  margin-left:calc(-1 * var(--gut-l));margin-right:calc(-1 * var(--gut-r));padding-left:var(--gut-l);padding-right:var(--gut-r);
  border-bottom:1px solid var(--band-line);box-shadow:0 6px 14px -12px rgba(0,0,0,.45)}
.mh-row{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:32px;height:32px;flex:none}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.ctl{display:flex;align-items:center;gap:8px;border-radius:10px;padding:4px 5px 4px 10px;background:var(--surface);color:var(--ink)}
.ctl-product{border:2px solid var(--dim)}
.ctl-mode{border:2px solid var(--mea)}
.ctl-label{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:5px}
.ctl-label svg{width:12px;height:12px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.spill{border:1.5px solid var(--dim);color:var(--dim);background:transparent;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px}
.spill.on{background:var(--dim);color:var(--surface)}
.spill.m{border-color:var(--mea);color:var(--mea)} .spill.m.on{background:var(--mea);color:var(--surface)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--band-ink);background:transparent;color:var(--band-ink);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{background:var(--surface);color:var(--ink)}
.mh-sub{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding-block:7px 9px;border-top:1px solid var(--band-line)}
.mh-sub h2{font-size:19px;font-weight:800}
.mh-sub p{margin:0;color:var(--band-soft);font-size:14px;flex:1;min-width:240px}
.mh-sub .stats{font-family:var(--f-mono);font-size:12px;color:var(--band-soft);white-space:nowrap}
.mh-sub .eyebrow{color:var(--band-soft)}

/* titles and important names */
.brand h1,.mh-sub h2,.lesson-head h2,.dayhead h2,.body h3,.quiz h3,.sectionlbl h3,.card h3,.lab-h h3,.cc-out h4,.mod > summary,.acc > summary,.titem.cur{color:var(--title)}

/* general layout */
.general{display:grid;grid-template-columns:clamp(260px,22vw,340px) minmax(0,1fr);gap:18px;align-items:start}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:calc(var(--mh, 120px) + 12px);max-height:calc(100vh - var(--mh, 120px) - 24px);display:flex;flex-direction:column;overflow:hidden}
.pane-head{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pane-head label{font-size:12px;color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;font:inherit;font-size:14px;color:var(--ink)}
.toc{overflow:auto;padding:6px 0 12px}
.mod > summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.mod > summary::-webkit-details-marker{display:none}
.mod > summary .caret{transition:transform .15s;color:var(--muted);font-size:10px}
.mod[open] > summary .caret{transform:rotate(90deg)}
.mod > summary .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.titem{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:5px 12px 5px 30px;font-size:14px;color:var(--ink);border-left:3px solid transparent}
.titem:hover{background:var(--sunk)}
.titem.cur{background:var(--dim-bg);border-left-color:var(--dim);font-weight:700}
.titem .num{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:30px;flex:none}
.titem .ok{margin-left:auto;color:var(--mea);font-weight:700;flex:none}
.lesson,.daymain,.dayshelf{scroll-margin-top:calc(var(--mh, 120px) + 12px)}
.toc-empty{padding:12px;color:var(--muted);font-size:14px}
.pane-toggle{display:none}

/* lesson */
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,36px);min-width:0;display:flex;flex-direction:column;gap:18px}
.lesson-head{display:flex;flex-direction:column;gap:10px}
.lesson-head h2{font-size:clamp(24px,3.2vw,34px);font-weight:800;letter-spacing:-.015em}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px;background:var(--sunk);color:var(--muted)}
.tag.Basic{background:var(--dim-bg);color:var(--dim)} .tag.Intermediate{background:var(--accent-bg);color:var(--accent)} .tag.Advanced{background:var(--warn-bg);color:var(--warn)}
.learn-btn{margin-left:auto;border:1.5px solid var(--mea);color:var(--mea);background:transparent;border-radius:999px;padding:5px 14px;font-weight:700;font-size:14px}
.learn-btn.on{background:var(--mea);color:var(--surface)}
.lead{font-size:19px;line-height:1.5;margin:0}
.body{display:flex;flex-direction:column;gap:14px}
.body p{margin:0}
.body h3{font-size:18px;margin-top:6px}
.body ul,.body ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.body ol li::marker{font-family:var(--f-mono);color:var(--dim);font-weight:600}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;background:var(--sunk);font-weight:700;padding:8px 10px;white-space:nowrap;font-size:13px}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:700}
.note{border-radius:6px;padding:12px 14px;display:flex;gap:10px;font-size:15px}
.note b.lbl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;flex:none;padding-top:3px}
.note.tip{background:var(--mea-bg)} .note.tip b.lbl{color:var(--mea)}
.note.warn{background:var(--warn-bg)} .note.warn b.lbl{color:var(--warn)}
.note.try{background:var(--accent-bg)} .note.try b.lbl{color:var(--accent)}
pre{margin:0;background:var(--sunk);border-radius:6px;padding:14px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;line-height:1.6}
.pill{display:inline-block;font-family:var(--f-body);font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 9px;color:var(--surface);white-space:nowrap;margin:1px 0}
.pill.d{background:var(--dim)} .pill.m{background:var(--mea)}

/* quiz */
.quiz{border-top:1px dashed var(--line);padding-top:18px;display:flex;flex-direction:column;gap:14px}
.quiz h3{font-size:18px;display:flex;align-items:center;gap:10px}
.qcard{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.qcard p{margin:0;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--dim)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--mea);background:var(--mea-bg);font-weight:700}
.opt.wrong{border-color:var(--warn);background:var(--warn-bg)}
.why{font-size:14px;color:var(--muted)}
.why b{color:var(--ink)}
.retry{align-self:flex-start;border:0;background:none;color:var(--dim);font-size:13px;text-decoration:underline;padding:0}

.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.navbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-size:14px;max-width:48%;text-align:left}
.navbtn small{display:block;color:var(--muted);font-size:12px}
.navbtn:hover{border-color:var(--dim)}
.navbtn.next{text-align:right;margin-left:auto}

/* labs */
.lab{border:1.5px solid var(--dim);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.lab-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lab-h h3{margin:0;font-size:18px}
.lab-h .tag{background:var(--dim);color:var(--surface)}
.goals{display:flex;flex-wrap:wrap;gap:6px}
.goal{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px}
.goal.on{background:var(--dim);color:var(--surface);border-color:var(--dim);font-weight:700}
.cc-out{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;align-items:start;background:var(--bg);border-radius:6px;padding:14px}
.cc-out h4{margin:0 0 4px;font-family:var(--f-display);font-size:20px}
.cc-out p{margin:0 0 6px;font-size:14px}
.cc-out .lbl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.glyph{width:100%;max-width:140px;height:auto;background:var(--surface);border-radius:6px;border:1px solid var(--line)}
.glyph .g1{fill:var(--dim)} .glyph .g2{fill:var(--mea)} .glyph .g3{fill:var(--accent)}
.glyph .gl{fill:none;stroke:var(--dim);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.glyph .gt{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3}
.glyph .gb{fill:var(--sunk)} .glyph .ax{stroke:var(--line);stroke-width:1}
.pills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.pf{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;flex-wrap:wrap}
.pf .name{font-weight:700;flex:1;min-width:110px}
.pf button{border:1.5px solid var(--dim);color:var(--dim);background:var(--surface);border-radius:999px;font-size:12px;font-weight:700;padding:2px 10px}
.pf button.m{border-color:var(--mea);color:var(--mea)}
.pf.done{background:var(--surface)}
.pf .res{flex-basis:100%;font-size:13px;color:var(--muted)}
.pf .res b.ok{color:var(--mea)} .pf .res b.no{color:var(--warn)}
.score{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* day plan */
.dayshelf{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;overflow-x:auto}
.shelf-label{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none;display:flex;align-items:center;gap:6px}
.shelf-label svg{width:14px;height:14px}
.days{display:flex;gap:6px;flex:none}
.dpill{border:1.5px solid var(--dim);color:var(--dim);background:transparent;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dpill.done{background:var(--mea);border-color:var(--mea);color:var(--surface)}
.dpill.cur{outline:2px solid var(--accent);outline-offset:2px}
.dpill.on{background:var(--dim);color:var(--surface)}
.dpill.done.on{background:var(--mea)}
.dayview{display:grid;grid-template-columns:minmax(0,1fr) clamp(280px,22vw,360px);gap:18px;align-items:start}
.daymain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,32px);display:flex;flex-direction:column;gap:18px;min-width:0}
.dayhead h2{font-size:clamp(24px,3.4vw,36px);font-weight:800;letter-spacing:-.02em;margin-top:4px}
.dayhead .meta{margin-top:10px}
.side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:16px}
.goals-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.goals-list li{display:flex;gap:8px}
.goals-list li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--dim);margin-top:6px}
.task{background:var(--accent-bg);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.task b.lbl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.task p{margin:0}
.acc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.acc + .acc{margin-top:-10px}
.acc > summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700;background:var(--bg)}
.acc > summary::-webkit-details-marker{display:none}
.acc > summary .num{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
.acc > summary .ok{margin-left:auto;color:var(--mea);font-size:13px}
.acc > summary .caret{color:var(--muted);font-size:10px;transition:transform .15s}
.acc[open] > summary .caret{transform:rotate(90deg)}
.acc-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.acc-body .lesson-head h2{font-size:22px}
.daybtns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:6px;padding:9px 16px;font-weight:700;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.done{background:var(--mea);border-color:var(--mea);color:var(--surface)}
.sectionlbl{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sectionlbl h3{font-size:20px}
.pace{font-size:14px;color:var(--muted);margin:0}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:13px;max-height:420px;overflow:auto}
.timeline button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:4px;align-items:baseline}
.timeline button:hover{background:var(--sunk)}
.timeline .dn{font-family:var(--f-mono);color:var(--muted);width:44px;flex:none}
.timeline .on{background:var(--dim-bg);font-weight:700}
.timeline .ok{margin-left:auto;color:var(--mea)}

footer{color:var(--muted);font-size:17px;display:flex;justify-content:center;text-align:center;border-top:1px solid var(--line);padding-top:16px}
footer .credit{color:var(--muted)}
footer .mail{color:var(--title);font-weight:700;user-select:all;word-break:break-all}

@media (max-width: 900px){
  .general{grid-template-columns:1fr}
  .pane{position:static;max-height:none}
  .pane-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:12px;font-weight:700}
  .pane:not(.open) .pane-head,.pane:not(.open) .toc{display:none}
  .dayview{grid-template-columns:1fr}
  .controls{margin-left:0}
}
@media (max-width: 520px){
  .cc-out{grid-template-columns:1fr}
  .mh-sub p,.mh-sub .stats{display:none}
  .ctl-label span{display:none}
  .navbtn{max-width:100%;width:100%}
  .navbtn.next{text-align:left}
  .learn-btn{margin-left:0}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="wrap">
  <header class="masthead" id="masthead">
    <div class="mh-row">
      <div class="brand">
        <svg viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="18" width="6" height="13" rx="1.5" fill="var(--dim)"/><rect x="11" y="10" width="6" height="21" rx="1.5" fill="var(--dim)"/><rect x="19" y="4" width="6" height="27" rx="1.5" fill="var(--mea)"/><rect x="27" y="14" width="4" height="17" rx="1.5" fill="var(--accent)"/></svg>
        <h1>Tableau Learning Lab</h1>
      </div>
      <div class="controls">
        <div class="ctl ctl-product" role="group" aria-label="Product">
          <span class="ctl-label"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="0" y="1" width="3" height="10" fill="var(--dim)"/><rect x="4.5" y="1" width="3" height="10" fill="var(--dim)"/><rect x="9" y="1" width="3" height="10" fill="var(--dim)"/></svg><span>Product</span></span>
          <div class="seg" id="productPills"></div>
        </div>
        <div class="ctl ctl-mode" role="group" aria-label="Mode">
          <span class="ctl-label"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="0" y="0" width="12" height="3" fill="var(--mea)"/><rect x="0" y="4.5" width="12" height="3" fill="var(--mea)"/><rect x="0" y="9" width="12" height="3" fill="var(--mea)"/></svg><span>Mode</span></span>

{ id:"d-tablecalc", t:"Table calculations", lvl:"Advanced", min:15,
  lead:"Table calculations compute on the numbers already in the view: running totals, % of total, rank, difference from previous.",
  b:[
   {ul:["Right-click a measure pill → **Quick Table Calculation**: Running Total, Difference, Percent Difference, Percent of Total, Rank, Percentile, Moving Average, YTD Total, Compound Growth Rate, Year over Year Growth, YTD Growth.","A triangle (Δ) on the pill marks a table calculation.","**Compute Using** sets direction: Table (across), Table (down), Pane, Cell, or specific dimensions.","Advanced: Edit Table Calculation → choose addressing (the direction) and partitioning (where it restarts)."]},
   {code:`RUNNING_SUM(SUM([Sales]))
SUM([Sales]) / TOTAL(SUM([Sales]))          // percent of total
RANK(SUM([Sales]))
WINDOW_AVG(SUM([Sales]), -2, 0)            // 3-period moving average
(ZN(SUM([Sales])) - LOOKUP(ZN(SUM([Sales])), -1))
  / ABS(LOOKUP(ZN(SUM([Sales])), -1))      // % change vs previous`},
   {tip:"Table calcs are computed late (after measure filters), so filtering can change their results. Use a table calc filter like `LOOKUP(MIN([Month]),0)` to hide rows without breaking the calc."}

{FIXED [Customer ID] : MIN([Order Date])}

SUM([Sales]) / SUM({EXCLUDE [Sub-Category] : SUM([Sales])})`},

const CHART_GOALS = [

 {f:"Customer Name", a:"d", w:"Text that names who; you group by it, never add it."},
 {f:"Sales", a:"m", w:"A number you sum or average."},

<script>
(function(){
const PLATFORM = "tableau";
const PRODUCTS = COURSES[PLATFORM].products;
const PKEYS = Object.keys(PRODUCTS);

/* ---------- state ---------- */
/* Every page load (and the Start over button) begins from this initial state. */
const INITIAL = () => ({product:"desktop", mode:"general", cur:{}, day:{}, learned:{}, done:{}, quiz:{}, pills:{}, goal:0});
let S = INITIAL();
function save(){}

/* ---------- index ---------- */
const IDX = {}; const ORDER = {};
PKEYS.forEach(pk => {
  ORDER[pk] = [];
  PRODUCTS[pk].modules.forEach((m, mi) => m.topics.forEach((t, ti) => {
    IDX[t.id] = {t, m, mi, ti, pk, num:(mi+1) + "." + (ti+1)};
    ORDER[pk].push(t.id);
  }));
});

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(s){
  return esc(s)
    .replace(/\[\[([^\]|]+)\|([dm])\]\]/g, (_, t, k) => '<span class="pill ' + k + '">' + t + '</span>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
const P = () => PRODUCTS[S.product];
function learnedCount(pk){ return ORDER[pk].filter(id => S.learned[id]).length; }
function dayDone(pk, n){ return !!S.done[pk + "-" + n]; }
function firstOpenDay(pk){ const d = PRODUCTS[pk].days; for (let i=0;i<d.length;i++) if (!dayDone(pk,i+1)) return i+1; return d.length; }

/* ---------- glyphs ---------- */
function glyph(k){
  let g = '<line x1="6" y1="54" x2="90" y2="54" class="ax"/>';
  const bars = (hs, w, gap, x0, cls) => hs.map((h,i)=>'<rect x="'+(x0+i*gap)+'" y="'+(54-h)+'" width="'+w+'" height="'+h+'" rx="1" class="'+(cls||"g1")+'"/>').join("");
  switch(k){
    case "bar": g += bars([42,30,24,16,9],12,17,9); break;
    case "line": g += '<polyline points="8,46 22,38 36,41 50,27 64,30 78,18 90,12" class="gl"/>'; break;
    case "stack": [[22,14],[28,10],[16,18],[24,12]].forEach(([a,b],i)=>{const x=12+i*20; g+='<rect x="'+x+'" y="'+(54-a)+'" width="14" height="'+a+'" class="g1"/><rect x="'+x+'" y="'+(54-a-b)+'" width="14" height="'+b+'" class="g2"/>';}); break;
    case "hist": g += bars([6,14,26,40,34,22,11,5],10,10.5,7); break;
    case "scatter": [[14,46],[22,40],[30,42],[38,32],[46,34],[54,24],[62,27],[72,17],[82,13],[44,40],[66,20]].forEach(([x,y])=>g+='<circle cx="'+x+'" cy="'+y+'" r="3" class="g1"/>'); g+='<line x1="10" y1="48" x2="88" y2="10" class="gt"/>'; break;
    case "map": g = '<path d="M12 22 Q22 8 42 12 T72 10 Q90 16 86 32 Q82 50 58 50 Q38 54 24 46 Q8 38 12 22Z" class="gb"/>'; [[30,22,6],[52,20,4],[66,34,8],[40,38,3],[74,20,3]].forEach(([x,y,r])=>g+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" class="g1" opacity=".85"/>'); break;
    case "table": g=''; for(let r=0;r<4;r++) for(let c=0;c<5;c++){ const o=[.25,.5,.9,.4,.7,.3,.95,.55,.2,.8][(r*5+c)%10]; g+='<rect x="'+(8+c*16.5)+'" y="'+(6+r*12.5)+'" width="15" height="11" class="g1" opacity="'+o+'"/>'; } break;
    case "bullet": g=''; [[70,52,60],[80,64,58],[60,30,50]].forEach(([bg,v,t],i)=>{const y=8+i*16; g+='<rect x="8" y="'+y+'" width="'+bg+'" height="12" class="gb"/><rect x="8" y="'+(y+3)+'" width="'+v+'" height="6" class="g1"/><rect x="'+(8+t)+'" y="'+(y-1)+'" width="2.5" height="14" class="g3"/>';}); break;
    case "gantt": g=''; [[8,30],[30,22],[44,30],[60,26]].forEach(([x,w],i)=>g+='<rect x="'+x+'" y="'+(8+i*12)+'" width="'+w+'" height="8" rx="2" class="'+(i%2?"g2":"g1")+'"/>'); break;
    case "box": [[20,18,34,12,44],[48,10,26,6,38],[76,22,38,14,48]].forEach(([x,q1,q3,lo,hi])=>{g+='<line x1="'+x+'" y1="'+lo+'" x2="'+x+'" y2="'+hi+'" class="ax" style="stroke:var(--muted)"/><rect x="'+(x-8)+'" y="'+q1+'" width="16" height="'+(q3-q1)+'" class="g1" opacity=".75"/><line x1="'+(x-8)+'" y1="'+((q1+q3)/2)+'" x2="'+(x+8)+'" y2="'+((q1+q3)/2)+'" style="stroke:var(--surface);stroke-width:2"/>';}); break;
    case "combo": g += bars([30,36,26,40,34],11,16,10); g += '<polyline points="15,30 31,22 47,28 63,14 79,18" class="gl" style="stroke:var(--accent)"/>'; break;
  }
  return '<svg viewBox="0 0 96 60" class="glyph" aria-hidden="true">' + g + '</svg>';
}

/* ---------- labs ---------- */
function chartLab(){
  const gi = Math.min(S.goal||0, CHART_GOALS.length-1);
  return '<div class="lab" data-lab="chart"><div class="lab-h"><span class="tag">Lab</span><h3>Chart chooser</h3></div>' +
    '<p class="pace">Pick what you want to show. The lab recommends a chart and how to build it.</p>' +
    '<div class="goals">' + CHART_GOALS.map((g,i)=>'<button type="button" class="goal'+(i===gi?' on':'')+'" data-goal="'+i+'">'+esc(g.g)+'</button>').join("") + '</div>' +
    '<div class="cc-out">' + chartOut(gi) + '</div></div>';
}
function chartOut(i){
  const g = CHART_GOALS[i];
  return glyph(g.k) + '<div><span class="lbl">Recommended</span><h4>'+esc(g.c)+'</h4><p>'+esc(g.why)+'</p><p><span class="lbl">Build</span><br>'+esc(g.how)+'</p><p><span class="lbl">Avoid</span><br>'+esc(g.avoid)+'</p></div>';
}
function pillLab(){
  let right = 0, answered = 0;
  const rows = PILL_FIELDS.map((p,i)=>{
    const pick = S.pills[i];
    if (pick){ answered++; if (pick===p.a) right++; }
    const res = pick ? '<span class="res">'+(pick===p.a?'<b class="ok">Correct.</b> ':'<b class="no">Not quite.</b> ')+esc(p.w)+'</span>' : '';
    const pillName = pick ? '<span class="pill '+p.a+'">'+esc(p.f)+'</span>' : esc(p.f);
    return '<div class="pf'+(pick?' done':'')+'"><span class="name">'+pillName+'</span>' +
      (pick ? '' : '<button type="button" data-pill="'+i+'" data-pick="d">Dimension</button><button type="button" class="m" data-pill="'+i+'" data-pick="m">Measure</button>') + res + '</div>';
  }).join("");
  return '<div class="lab" data-lab="pills"><div class="lab-h"><span class="tag">Lab</span><h3>Pill sorter: dimension or measure?</h3><span class="score" style="margin-left:auto">'+right+' / '+PILL_FIELDS.length+' correct · '+answered+' answered</span></div>' +
    '<div class="pills-grid">' + rows + '</div>' +
    (answered ? '<button type="button" class="retry" data-pillreset="1">Start over</button>' : '') + '</div>';
}

/* ---------- blocks ---------- */
function block(b){
  if (b.p) return '<p>'+fmt(b.p)+'</p>';
  if (b.h) return '<h3>'+fmt(b.h)+'</h3>';
  if (b.ul) return '<ul>'+b.ul.map(x=>'<li>'+fmt(x)+'</li>').join("")+'</ul>';
  if (b.ol) return '<ol>'+b.ol.map(x=>'<li>'+fmt(x)+'</li>').join("")+'</ol>';
  if (b.tbl) return '<div class="tblwrap"><table><thead><tr>'+b.tbl.h.map(h=>'<th>'+fmt(h)+'</th>').join("")+'</tr></thead><tbody>'+b.tbl.r.map(r=>'<tr>'+r.map(c=>'<td>'+fmt(c)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>';
  if (b.tip) return '<div class="note tip"><b class="lbl">Tip</b><span>'+fmt(b.tip)+'</span></div>';
  if (b.warn) return '<div class="note warn"><b class="lbl">Watch out</b><span>'+fmt(b.warn)+'</span></div>';
  if (b.try) return '<div class="note try"><b class="lbl">Try it</b><span>'+fmt(b.try)+'</span></div>';
  if (b.code) return '<pre>'+esc(b.code)+'</pre>';
  if (b.lab === "chart") return chartLab();
  if (b.lab === "pills") return pillLab();
  return "";
}

/* ---------- quiz ---------- */
function quizCard(tid, i){
  const qq = IDX[tid].t.q[i]; const key = tid + "#" + i; const pick = S.quiz[key];
  const answered = pick !== undefined;
  const opts = qq.o.map((o,oi)=>{
    let cls = "opt";
    if (answered){ if (oi===qq.a) cls+=" right"; else if (oi===pick) cls+=" wrong"; }
    return '<button type="button" class="'+cls+'" data-q="'+key+'" data-o="'+oi+'"'+(answered?' disabled':'')+'>'+fmt(o)+'</button>';
  }).join("");
  const why = answered ? '<div class="why"><b>'+(pick===qq.a?'Correct. ':'The answer is: '+esc(qq.o[qq.a])+'. ')+'</b>'+fmt(qq.w)+'</div><button type="button" class="retry" data-qreset="'+key+'">Try again</button>' : '';
  return '<div class="qcard" data-qcard="'+key+'"><p>'+fmt(qq.q)+'</p><div class="opts">'+opts+'</div>'+why+'</div>';
}
function quizSection(ids, title){
  const cards = [];
  ids.forEach(id => (IDX[id].t.q||[]).forEach((_,i)=>cards.push(quizCard(id,i))));
  if (!cards.length) return "";
  return '<section class="quiz"><h3>'+esc(title)+' <span class="score">'+cards.length+' question'+(cards.length>1?'s':'')+'</span></h3>'+cards.join("")+'</section>';
}

/* ---------- lesson ---------- */
function lessonHTML(id, opt){
  opt = opt || {};
  const x = IDX[id], t = x.t, on = !!S.learned[id];
  let h = '<div class="lesson-head">';
  if (!opt.compact) h += '<span class="eyebrow">Module '+(x.mi+1)+' · '+esc(x.m.t)+'</span>';
  h += '<h2>'+(opt.compact?'':'<span style="color:var(--muted);font-weight:500">'+x.num+'</span> ')+esc(t.t)+'</h2>';
  h += '<div class="meta"><span class="tag '+t.lvl+'">'+t.lvl+'</span><span class="tag">~'+t.min+' min</span>' +
       '<button type="button" class="learn-btn'+(on?' on':'')+'" data-learn="'+id+'" aria-pressed="'+on+'">'+(on?'✓ Learned':'Mark as learned')+'</button></div></div>';
  h += '<p class="lead">'+fmt(t.lead)+'</p>';
  h += '<div class="body">'+t.b.map(block).join("")+'</div>';
  if (!opt.noQuiz) h += quizSection([id], "Quick check");
  return h;
}

/* ---------- top bar ---------- */
function renderShelves(){
  $("#productPills").innerHTML = PKEYS.map(pk=>'<button type="button" class="spill'+(pk===S.product?' on':'')+'" data-product="'+pk+'" aria-pressed="'+(pk===S.product)+'">'+esc(PRODUCTS[pk].short)+'</button>').join("");
  $("#modePills").innerHTML =
    '<button type="button" class="spill m'+(S.mode==='general'?' on':'')+'" data-mode="general" aria-pressed="'+(S.mode==='general')+'">General</button>' +
    '<button type="button" class="spill m'+(S.mode==='plan'?' on':'')+'" data-mode="plan" aria-pressed="'+(S.mode==='plan')+'">Time-bounded</button>';
}
function renderIntro(){
  const p = P(), topics = ORDER[S.product].length, mins = ORDER[S.product].reduce((a,id)=>a+IDX[id].t.min,0);
  $("#intro").innerHTML = '<h2>'+esc(p.label)+'</h2><span class="eyebrow">'+(S.mode==='general'?'General · explore in sequence':'Time-bounded · '+p.days.length+'-day plan')+'</span><p>'+esc(p.blurb)+'</p>' +
    '<span class="stats">'+p.modules.length+' modules · '+topics+' topics · '+p.days.length+' days · ~'+Math.round(mins/60)+'h reading</span>';
}

/* ---------- general mode ---------- */
let filterText = "";
function tocHTML(){
  const pk = S.product, cur = S.cur[pk] || ORDER[pk][0], f = filterText.trim().toLowerCase();
  let any = false;
  const html = P().modules.map((m,mi)=>{
    const items = m.topics.filter(t => !f || (t.t + " " + t.lead + " " + JSON.stringify(t.b)).toLowerCase().includes(f));
    if (!items.length) return "";
    any = true;
    const done = m.topics.filter(t=>S.learned[t.id]).length;
    const open = f || m.topics.some(t=>t.id===cur);
    return '<details class="mod"'+(open?' open':'')+'><summary><span class="caret">▶</span>'+(mi+1)+'. '+esc(m.t)+'<span class="cnt">'+done+'/'+m.topics.length+'</span></summary>' +
      items.map(t=>'<button type="button" class="titem'+(t.id===cur?' cur':'')+'" data-topic="'+t.id+'"><span class="num">'+IDX[t.id].num+'</span><span>'+esc(t.t)+'</span>'+(S.learned[t.id]?'<span class="ok">✓</span>':'')+'</button>').join("") + '</details>';
  }).join("");
  return any ? html : '<div class="toc-empty">No topics match “'+esc(filterText)+'”.</div>';
}
function renderGeneral(){
  const pk = S.product;
  if (!S.cur[pk] || !IDX[S.cur[pk]]) S.cur[pk] = ORDER[pk][0];
  const id = S.cur[pk], i = ORDER[pk].indexOf(id);
  const prev = ORDER[pk][i-1], next = ORDER[pk][i+1];
  const nav = '<div class="navrow">' +
    (prev ? '<button type="button" class="navbtn" data-topic="'+prev+'"><small>← Previous</small>'+esc(IDX[prev].t.t)+'</button>' : '') +
    (next ? '<button type="button" class="navbtn next" data-topic="'+next+'"><small>Next →</small>'+esc(IDX[next].t.t)+'</button>' : '<span class="pace">You reached the end of this track. Try Time-bounded mode for daily practice tasks.</span>') + '</div>';
  $("#view").innerHTML = '<div class="general">' +
    '<aside class="pane" id="pane"><button type="button" class="pane-toggle" id="paneToggle" aria-expanded="false">Topics · '+IDX[id].num+' '+esc(IDX[id].t.t)+'<span>▾</span></button>' +
    '<div class="pane-head"><label for="search">Search topics</label><input class="search" id="search" type="search" placeholder="e.g. LOD, union, .twbx" value="'+esc(filterText)+'"></div>' +
    '<div class="toc" id="toc">'+tocHTML()+'</div></aside>' +
    '<article class="lesson" id="lesson">'+lessonHTML(id)+nav+'</article></div>';
}

/* ---------- plan mode ---------- */
function renderPlan(){
  const pk = S.product, days = P().days;
  let n = S.day[pk] || firstOpenDay(pk); if (n > days.length) n = days.length; S.day[pk] = n;
  const d = days[n-1], current = firstOpenDay(pk);
  const shelf = '<div class="dayshelf" role="tablist" aria-label="Days"><span class="shelf-label"><svg viewBox="0 0 14 14"><rect x="1" y="2" width="12" height="11" rx="1" fill="none" stroke="var(--muted)" stroke-width="1.5"/><rect x="1" y="2" width="12" height="3" fill="var(--muted)"/></svg>Days</span><div class="days">' +
    days.map((_,i)=>{const k=i+1; return '<button type="button" role="tab" aria-selected="'+(k===n)+'" class="dpill'+(dayDone(pk,k)?' done':'')+(k===n?' on':'')+(k===current&&!dayDone(pk,k)?' cur':'')+'" data-day="'+k+'">'+(dayDone(pk,k)?'✓ ':'')+'Day '+k+'</button>';}).join("") + '</div></div>';
  const mins = d.topics.reduce((a,id)=>a+IDX[id].t.min,0) + 30;
  const lessons = d.topics.map((id,i)=>'<details class="acc" data-acc="'+id+'"><summary><span class="caret">▶</span><span class="num">'+(i+1)+'</span>'+esc(IDX[id].t.t)+'<span class="ok">'+(S.learned[id]?'✓ learned':'')+'</span></summary><div class="acc-body">'+lessonHTML(id,{compact:true,noQuiz:true})+'</div></details>').join("");
  const reviewIds = d.topics.concat(d.review||[]);
  const doneNow = dayDone(pk,n);
  const main = '<div class="daymain">' +
    '<div class="dayhead"><span class="eyebrow">Day '+n+' of '+days.length+(n===current&&!doneNow?' · your current day':'')+'</span><h2>'+esc(d.t)+'</h2>' +
    '<div class="meta"><span class="tag">'+(d.topics.length?d.topics.length+' lesson'+(d.topics.length>1?'s':''):'Project day')+'</span><span class="tag">~'+mins+' min incl. task</span>'+(doneNow?'<span class="tag Basic" style="background:var(--mea-bg);color:var(--mea)">Completed</span>':'')+'</div></div>' +
    (lessons ? '<div class="sectionlbl"><h3>Today\'s lessons</h3><span class="pace">Open each one, then mark it learned.</span></div>' + lessons : '') +
    '<div class="task"><b class="lbl">Hands-on task</b><p>'+fmt(d.task)+'</p></div>' +
    quizSection(reviewIds, d.review && !d.topics.length ? "Final checkpoint" : "Day "+n+" checkpoint") +
    '<div class="daybtns"><button type="button" class="btn'+(doneNow?' done':'')+'" data-doneday="'+n+'">'+(doneNow?'✓ Day '+n+' complete':'Mark Day '+n+' complete')+'</button>' +
    (n < days.length ? '<button type="button" class="btn ghost" data-day="'+(n+1)+'">Go to Day '+(n+1)+' →</button>' : '') + '</div></div>';
  const side = '<aside class="side">' +
    '<div class="card"><h3>Goals for today</h3><ul class="goals-list">'+d.goals.map(g=>'<li>'+fmt(g)+'</li>').join("")+'</ul></div>' +
    '<div class="card"><h3>The whole plan</h3><p class="pace">About 60–90 minutes a day. Days are open in any order; your current day is outlined.</p><ul class="timeline">' +
    days.map((x,i)=>'<li><button type="button" class="'+(i+1===n?'on':'')+'" data-day="'+(i+1)+'"><span class="dn">Day '+(i+1)+'</span><span>'+esc(x.t)+'</span>'+(dayDone(pk,i+1)?'<span class="ok">✓</span>':'')+'</button></li>').join("") + '</ul></div></aside>';
  $("#view").innerHTML = shelf + '<div class="dayview" style="margin-top:14px">' + main + side + '</div>';
}

/* ---------- render ---------- */
function render(keepOpen){
  const open = keepOpen ? [...document.querySelectorAll("details.acc[open]")].map(e=>e.dataset.acc) : [];
  const paneOpen = keepOpen && $("#pane") && $("#pane").classList.contains("open");
  renderShelves(); renderIntro();
  if (S.mode === "general") renderGeneral(); else renderPlan();
  open.forEach(id => { const el = document.querySelector('details.acc[data-acc="'+id+'"]'); if (el) el.open = true; });
  if (paneOpen && $("#pane")) { $("#pane").classList.add("open"); $("#paneToggle").setAttribute("aria-expanded","true"); }
  setMH();
}
function setMH(){ const m = $("#masthead"); if (m) document.documentElement.style.setProperty("--mh", m.offsetHeight + "px"); }
window.addEventListener("resize", setMH);

/* ---------- theme ---------- */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function isDark(){ const a = document.documentElement.getAttribute("data-theme"); if (a) return a === "dark"; return !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
function paintThemeBtn(){ const b = $("#themeBtn"), d = isDark(); b.innerHTML = d ? SUN : MOON; b.title = d ? "Switch to light theme" : "Switch to dark theme"; b.setAttribute("aria-label", b.title); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const ds = t.dataset;
  if (ds.product){ S.product = ds.product; filterText = ""; render(); return; }
  if (ds.mode){ S.mode = ds.mode; render(); return; }
  if (ds.topic){ S.cur[S.product] = ds.topic; render(true); const l=$("#lesson"); if (l && window.innerWidth<900) l.scrollIntoView({behavior:"smooth",block:"start"}); else window.scrollTo({top:0,behavior:"smooth"}); return; }
  if (ds.learn){ if (S.learned[ds.learn]) delete S.learned[ds.learn]; else S.learned[ds.learn] = 1; render(true); return; }
  if (ds.day){ S.day[S.product] = +ds.day; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if (ds.doneday){ const k = S.product+"-"+ds.doneday; if (S.done[k]) delete S.done[k]; else { S.done[k]=1; const d=P().days[+ds.doneday-1]; d.topics.forEach(id=>S.learned[id]=1); } render(true); return; }
  if (ds.q !== undefined && ds.o !== undefined){ S.quiz[ds.q] = +ds.o; save(); const [tid,qi] = ds.q.split("#"); const card = t.closest(".qcard"); card.outerHTML = quizCard(tid,+qi); return; }
  if (ds.qreset){ delete S.quiz[ds.qreset]; save(); const [tid,qi] = ds.qreset.split("#"); t.closest(".qcard").outerHTML = quizCard(tid,+qi); return; }
  if (ds.goal !== undefined){ S.goal = +ds.goal; save(); const lab = t.closest(".lab"); lab.querySelectorAll(".goal").forEach((b,i)=>b.classList.toggle("on", i===S.goal)); lab.querySelector(".cc-out").innerHTML = chartOut(S.goal); return; }
  if (ds.pill !== undefined){ S.pills[ds.pill] = ds.pick; save(); t.closest(".lab").outerHTML = pillLab(); return; }
  if (ds.pillreset){ S.pills = {}; save(); t.closest(".lab").outerHTML = pillLab(); return; }
  if (t.id === "paneToggle"){ const p = $("#pane"); p.classList.toggle("open"); t.setAttribute("aria-expanded", p.classList.contains("open")); return; }
  if (t.id === "themeBtn"){ document.documentElement.setAttribute("data-theme", isDark() ? "light" : "dark"); paintThemeBtn(); return; }
  if (t.id === "restartBtn"){ S = INITIAL(); filterText = ""; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
});
document.addEventListener("input", e => {
  if (e.target.id === "search"){ filterText = e.target.value; $("#toc").innerHTML = tocHTML(); }
});

paintThemeBtn();
render();
})();
</script>

</body></html>
